name: Deploy to testing (TEST Container)

# This triggers ONLY when code is merged into any branch except 'main' & 'staging'
on:
  push:
    branches-ignore:
      - main
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Empty OS Login Keychain (Fix 32 KiB Limit)
        run: |
          echo "Clearing old SSH keys to make room..."
          KEYS=$(gcloud compute os-login ssh-keys list --format="value(fingerprint)")
          for key in $KEYS; do
            gcloud compute os-login ssh-keys remove --key="$key" --quiet || true
          done

      - name: SSH via IAP and Execute Refresh Script
        run: |
          gcloud compute ssh --quiet \
            --zone="${{ secrets.GCP_ZONE }}" \
            --project="${{ secrets.GCP_PROJECT_ID }}" \
            --tunnel-through-iap \
            "${{ secrets.GCP_VM_NAME }}" \
            --command="sudo bash /opt/samalink/scripts/refresh_test.sh ${{ github.ref_name }}"